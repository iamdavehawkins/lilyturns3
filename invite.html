<meta charset="UTF-8">
<title>Time to Paw-Ty — printable invites (4 per page)</title>

<!--
  Printable paper invite, four to a US Letter sheet (each card 4in x 5.25in).
  Print at 100% scale / "Actual size", NOT "Fit to page", or the cards will
  shrink and the cut lines won't line up. Cut along the dashed lines.

  The QR encodes https://lilyturns3.iamdavehawkins.com as an inline SVG, so
  this file is self-contained apart from the photo.
-->

<style>
    /* 0.25in margin because most home printers have an unprintable edge strip.
       At margin:0 the top row's rainbow stripe and the outer cut lines get
       clipped, or the user picks "Fit to page" and everything shrinks. */
    @page { size: 8.5in 11in; margin: 0.25in; }

    /* make sure the rainbow / pink actually print instead of being stripped */
    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    :root {
        --ink:      #3a2d43;
        --muted:    #8a7d95;
        --accent:   #ff4fa3;
        --accent-2: #9b5de5;
        --border:   #f4d9ea;
        --rainbow: linear-gradient(90deg,
                   #ff4fa3 0%, #ff8fc7 20%, #9b5de5 40%,
                   #4cc9f0 60%, #2ec4b6 80%, #ffd23f 100%);
    }

    html, body { margin: 0; padding: 0; background: #fff; }
    body { font-family: 'Courier New', monospace; color: var(--ink); }

    /* 8.5x11 less the 0.25in @page margin on each side */
    .sheet {
        width: 8in; height: 10.5in;
        display: grid;
        grid-template-columns: 4in 4in;
        grid-template-rows: 5.25in 5.25in;
    }

    .card {
        width: 4in; height: 5.25in;
        padding: 0.24in 0.22in 0.18in;
        border: 1px dashed #d8d8d8;   /* cut guide */
        display: flex; flex-direction: column; align-items: center;
        text-align: center;
        position: relative; overflow: hidden;
        background: #fff;
    }
    /* rainbow stripe across the top, echoing the site's cards */
    .card::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0;
        height: 0.09in; background: var(--rainbow);
    }
    /* soft polka dots, like the site background */
    .card::after {
        content: ""; position: absolute; inset: 0; z-index: 0;
        background-image: radial-gradient(var(--border) 1.2px, transparent 1.3px);
        background-size: 0.16in 0.16in;
    }
    .card > * { position: relative; z-index: 1; }

    /* 22pt keeps "Time to Paw-Ty!" on one line inside the 3.56in text column */
    h1 {
        font-size: 22pt; margin: 0.04in 0 0; color: var(--accent);
        letter-spacing: 0.01em; line-height: 1.1;
        text-shadow: 1.5px 1.5px 0 #fff, 3px 3px 0 var(--accent-2);
    }
    .sub {
        font-size: 11pt; font-weight: bold; color: var(--accent-2);
        margin: 0.05in 0 0;
    }
    .kicker {
        font-size: 9pt; color: var(--accent-2); font-weight: bold;
        margin: 0.06in 0 0; letter-spacing: 0.08em; text-transform: uppercase;
    }

    /* circular photo with cat ears */
    .photo { position: relative; margin: 0.13in 0 0.02in; }
    /* direct child only, so the cats don't inherit the circular pink frame */
    .photo > img {
        width: 1.12in; height: 1.12in; border-radius: 50%;
        object-fit: cover; object-position: center 28%;
        display: block; border: 3px solid var(--accent);
    }
    /* ears tuck in behind the circle so they read as ears, not stray triangles */
    .photo::before, .photo::after {
        content: ""; position: absolute; top: -0.07in; z-index: -1;
        border-left: 0.1in solid transparent;
        border-right: 0.1in solid transparent;
        border-bottom: 0.16in solid var(--accent);
    }
    .photo::before { left: 0.13in;  transform: rotate(-28deg); }
    .photo::after  { right: 0.13in; transform: rotate(28deg); }

    /* Gabby cats tucked around the photo */
    .photo .cat { position: absolute; width: 0.62in; height: auto; }
    .photo .c1 { top: -0.12in;  left: -0.66in;  transform: rotate(-12deg); }
    .photo .c2 { top: 0.62in;   left: -0.62in;  width: 0.56in; transform: rotate(10deg); }
    .photo .c3 { top: -0.14in;  right: -0.66in; transform: rotate(12deg); }
    .photo .c4 { top: 0.64in;   right: -0.62in; width: 0.56in; transform: rotate(-10deg); }

    .tagline {
        font-size: 9pt; font-weight: bold; color: var(--accent);
        margin: 0.11in 0 0;
    }

    .details {
        margin: 0.1in 0 0; font-size: 9.5pt; line-height: 1.45;
        width: 100%;
    }
    .details p { margin: 0.035in 0; }
    .details strong { color: var(--accent-2); }
    .details .where { font-size: 8.8pt; line-height: 1.35; }

    /* RSVP block with the QR beside the spelled-out URL */
    .rsvp {
        margin-top: auto;
        display: flex; align-items: center; gap: 0.12in;
        border: 2px solid var(--border); border-radius: 0.12in;
        padding: 0.09in 0.11in; width: 100%;
        background: #fff;
    }
    /* 1.05in across 33 modules ≈ 0.8mm per module, which phones scan reliably.
       Don't shrink this much further or it stops reading. */
    .rsvp svg { width: 1.05in; height: 1.05in; display: block; flex: none; }
    .rsvp-text { text-align: left; line-height: 1.3; }
    .rsvp-text .lead {
        font-size: 10pt; font-weight: bold; color: var(--accent); margin: 0;
    }
    .rsvp-text .url {
        font-size: 8.6pt; font-weight: bold; margin: 0.03in 0 0;
        word-break: break-all; color: var(--ink);
    }
    .rsvp-text .hint { font-size: 7pt; color: var(--muted); margin: 0.03in 0 0; }

    /* on screen only: a bit of grey around the sheet so the page edge is visible */
    @media screen {
        body { background: #f0eef2; padding: 24px 0; }
        .sheet { margin: 0 auto; background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,0.18); }
    }
</style>

<script>
// One card is defined above; stamp it four times so there's a single source of
// truth to edit. Runs before print in both Chrome headless and a normal Cmd+P.
(function () {
    const sheet = document.getElementById("sheet");
    const tpl   = document.getElementById("card");
    const QR    = document.getElementById("qrsrc").innerHTML;
    for (let i = 0; i < 4; i++) {
        const card = tpl.content.cloneNode(true);
        card.querySelector(".qr").innerHTML = QR;
        sheet.appendChild(card);
    }
})();
</script>
